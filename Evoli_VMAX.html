var camera=new THREE.PerspectiveCamera(32,1,0.1,50);
var camDist=9.2; camera.position.set(0,0,camDist);

var W=2.5,H=W*1024/736,R=0.12,T=0.025;
function roundedRect(w,h,r){
  var s=new THREE.Shape(),x=-w/2,y=-h/2;
  s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);
  s.lineTo(x+w,y+h-r);s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);
  s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);return s;
}
function fitUV(g){
  var p=g.attributes.position,uv=new Float32Array(p.count*2);
  for(var i=0;i<p.count;i++){uv[i*2]=(p.getX(i)+W/2)/W;uv[i*2+1]=(p.getY(i)+H/2)/H;}
  g.setAttribute('uv',new THREE.BufferAttribute(uv,2));
}
var shape=roundedRect(W,H,R);
var card=new THREE.Group(); scene.add(card);

var tex=new THREE.TextureLoader().load(IMG,function(){renderer.render(scene,camera);});
tex.anisotropy=8; tex.minFilter=THREE.LinearMipmapLinearFilter;

var holoU={map:{value:tex},uHolo:{value:1},uTime:{value:0},uSize:{value:new THREE.Vector2(W,H)}};
var frontMat=new THREE.ShaderMaterial({
  uniforms:holoU,
  vertexShader:[
  'varying vec2 vUv;varying vec3 vN;varying vec3 vV;varying vec3 vPos;',
  'void main(){',
  ' vUv=uv;vPos=position;',
  ' vec3 camLocal=(inverse(modelMatrix)*vec4(cameraPosition,1.0)).xyz;',
  ' vV=normalize(camLocal-position);vN=vec3(0.,0.,1.);',
  ' gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}'
  ].join('\n'),
  fragmentShader:[
  'precision highp float;',
  'uniform sampler2D map;uniform float uHolo;uniform float uTime;uniform vec2 uSize;',
  'varying vec2 vUv;varying vec3 vN;varying vec3 vV;varying vec3 vPos;',
  'vec3 pal(float t){return 0.5+0.5*cos(6.28318*(vec3(0.0,0.33,0.67)+t));}',
  'float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}',
  // four-point star
  'float star(vec2 p,float s){p=abs(p);float d=pow(p.x,0.5)+pow(p.y,0.5);return smoothstep(s,s*0.55,d);}',
  'void main(){',
  ' vec3 V=normalize(vV);',
  ' vec4 c=texture2D(map,vUv);',
  ' vec3 base=c.rgb;',
  ' vec2 tilt=V.xy/max(V.z,0.2);',
  ' float fres=pow(1.0-clamp(V.z,0.0,1.0),1.6);',
  // pearlescent thin-film tint over the whole card, shifts with view angle
  ' float lum=dot(base,vec3(0.299,0.587,0.114));',
  ' vec3 pearl=pal(V.z*1.6+vUv.y*0.35+vUv.x*0.2+0.08);',
  ' vec3 col=mix(base,base*0.72+pearl*0.5*(0.35+lum),0.30*uHolo+0.25*fres*uHolo);',
  // diagonal diffraction streaks
  ' vec2 q=vUv-0.5;',
  ' float ph=dot(q,vec2(0.78,0.62))*7.0+tilt.x*2.4-tilt.y*1.2;',
  ' float band=pow(0.5+0.5*sin(ph*6.28318),6.0);',
  ' float band2=pow(0.5+0.5*sin(ph*3.1416*2.7+1.3),10.0);',
  ' vec3 streak=pal(ph*0.9+tilt.x*0.6)*(band*0.8+band2*0.9);',
  ' float focus=smoothstep(1.2,0.0,length(tilt-vec2(q.x*-0.8,q.y*-0.8))*0.9);',
  ' col+=streak*0.55*uHolo*(0.35+0.65*focus)*(0.4+0.8*lum);',
  // sparkle stars on a jittered grid, brightness depends on view
  ' vec2 g=vUv*vec2(22.0,30.0);vec2 id=floor(g);vec2 f=fract(g)-0.5;',
  ' float h1=hash(id);float h2=hash(id+7.7);',
  ' vec2 off=(vec2(h1,h2)-0.5)*0.5;',
  ' float st=star(f-off,0.42)*step(0.45,h1);',
  ' float tw=pow(0.5+0.5*sin(h2*20.0+tilt.x*9.0+tilt.y*7.0+uTime*0.6),3.0);',
  ' col+=pal(h1*3.0+tilt.x*1.3+tilt.y)*st*tw*0.95*uHolo;',
  // soft broad specular sheen
  ' vec3 L=normalize(vec3(-0.35,0.55,0.75));',
  ' vec3 Hh=normalize(L+V);float spec=pow(max(Hh.z,0.0),90.0);',
  ' col+=vec3(1.0,0.97,0.92)*spec*0.45;',
  ' gl_FragColor=vec4(clamp(col,0.0,1.0),1.0);}'
  ].join('\n')
});
var fg=new THREE.ShapeGeometry(shape,24);fitUV(fg);
var front=new THREE.Mesh(fg,frontMat);front.position.z=T/2+0.0006;card.add(front);

// card back (user-supplied artwork)
var btex=new THREE.TextureLoader().load(BACK);btex.anisotropy=8;btex.minFilter=THREE.LinearMipmapLinearFilter;
var bg=new THREE.ShapeGeometry(shape,24);fitUV(bg);
var backMat=new THREE.MeshBasicMaterial({map:btex});
var back=new THREE.Mesh(bg,backMat);back.rotation.y=Math.PI;back.position.z=-T/2-0.0006;card.add(back);
// edge
var eg=new THREE.ExtrudeGeometry(shape,{depth:T,bevelEnabled:false,curveSegments:24});
eg.translate(0,0,-T/2);
var edge=new THREE.Mesh(eg,new THREE.MeshBasicMaterial({color:0xe9e4d6}));card.add(edge);


// interaction
var rotX=-0.08,rotY=0.35,velX=0,velY=0,dragging=false,lastX=0,lastY=0,auto=false,idleT=0,zoom=1;
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(reduce){auto=false;}
var pointers={},pinchD=0;
function setAuto(v){auto=v;}
stage.addEventListener('pointerdown',function(e){
  stage.setPointerCapture(e.pointerId);pointers[e.pointerId]={x:e.clientX,y:e.clientY};
  dragging=true;stage.classList.add('drag');lastX=e.clientX;lastY=e.clientY;velX=velY=0;
  if(auto){rotY=card.rotation.y;rotX=card.rotation.x;setAuto(false);}
});
stage.addEventListener('pointermove',function(e){
  if(!pointers[e.pointerId])return;
  pointers[e.pointerId]={x:e.clientX,y:e.clientY};
  var ids=Object.keys(pointers);
  if(ids.length===2){
    var a=pointers[ids[0]],c2=pointers[ids[1]],d=Math.hypot(a.x-c2.x,a.y-c2.y);
    if(pinchD){zoom=Math.min(2.2,Math.max(0.55,zoom*d/pinchD));}pinchD=d;return;
  }
  var dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;
  velY=dx*0.008;velX=dy*0.008;rotY+=velY;rotX+=velX;
  rotX=Math.max(-1.3,Math.min(1.3,rotX));
});
function up(e){delete pointers[e.pointerId];pinchD=0;if(!Object.keys(pointers).length){dragging=false;stage.classList.remove('drag');}}
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
stage.addEventListener('wheel',function(e){e.preventDefault();zoom=Math.min(2.2,Math.max(0.55,zoom*Math.exp(-e.deltaY*0.0012)));},{passive:false});
stage.addEventListener('dblclick',function(){rotX=-0.08;rotY=0.35;velX=velY=0;zoom=1;});

function resize(){
  var w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;
  renderer.setSize(w,h,false);camera.aspect=w/h;
  var need=(H*1.18)/(2*Math.tan(camera.fov*Math.PI/360));
  var needW=(W*1.35)/(2*Math.tan(camera.fov*Math.PI/360)*camera.aspect);
  camDist=Math.max(need,needW);camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);
if(window.ResizeObserver){new ResizeObserver(resize).observe(stage);}
resize();

var t0=performance.now();
function frame(now){
  var t=(now-t0)/1000;holoU.uTime.value=t;
  if(!dragging){
    rotY+=velY;rotX+=velX;velY*=0.94;velX*=0.94;
    rotX=Math.max(-1.3,Math.min(1.3,rotX));
  }
  var ay=rotY,ax=rotX;
  if(auto){ay=0.5*Math.sin(t*0.55);ax=-0.1+0.16*Math.cos(t*0.43);}
  card.rotation.set(ax,ay,0);
  camera.position.z=camDist/zoom;
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>

</body></html>
